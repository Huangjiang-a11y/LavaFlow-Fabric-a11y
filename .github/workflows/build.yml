name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LavaFlow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.1"

      # `check` rather than `test`: the Vulkan-facing tests live in the minecraft-test source set,
      # which is wired to `check` only. Running just `test` silently executes one pure-logic test
      # class and skips everything that covers the backend.
      - name: Build and test
        run: gradle --no-daemon clean check jar

      - name: Upload Fabric mod
        uses: actions/upload-artifact@v4
        with:
          name: lavaflow-fabric
          path: build/libs/lavaflow-*.jar
          if-no-files-found: error
          retention-days: 14
