name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build LavaFlow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # These actions are held at the first release that runs on Node 24, because the runners have
      # deprecated Node 20 and force these actions onto Node 24 instead. That puts a floor on the
      # runner version (2.327.1), which GitHub-hosted runners always meet. upload-artifact is the one
      # exception that has to go a major further: v5 declares node20 as well, so the deprecation
      # warning survives it and only v6 actually fixes it. Newer majors exist for all four, but they
      # bring changes beyond this one and are not what the warning asks for.
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.5.1"

      # The runner has no GPU and no display. Parts of the build do not need either, but the context
      # test in the minecraft-test source set really creates a window and a Vulkan device, and the
      # smoke run below really starts the renderer. Both therefore need a software Vulkan driver and
      # a virtual X server, and this has to happen before the build rather than after it.
      # lavapipe is deterministic, which is what makes an exact assertion reasonable rather than
      # flaky. The validation layer has to be installed as well: without it the renderer still exits
      # 0, it just reports that the switch could not be honoured, and the smoke step fails on purpose
      # rather than passing a run that validated nothing.
      #
      # The image points apt at azure.archive.ubuntu.com, which intermittently answers "Ign:" for
      # every index; apt then retries for 20+ minutes before falling back to archive.ubuntu.com
      # (actions/runner-images#14594, about 20% of runs). That step does not fail, it hangs — and this
      # repository has seen it: the same workflow on the same commit took 11s on one branch and 455s
      # on the other. apt's own retries and timeouts are therefore bounded, so an unhealthy mirror is
      # abandoned in seconds rather than eating the job's 20-minute limit.
      #
      # The step is deliberately non-fatal. A missing package is caught downstream instead: without
      # xvfb there is no xvfb-run, and the smoke step asserts that the validation layer actually
      # answered. So a flaky mirror cannot turn the build red, while a missing package still can —
      # and the warnings below say what is missing when that happens.
      - name: Install a software Vulkan driver, the validation layer and a virtual display
        timeout-minutes: 10
        run: |
          APT_OPTS="-o Acquire::Retries=1 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10"
          if ! timeout 150 sudo apt-get $APT_OPTS update -qq; then
            echo "::warning::apt-get update did not finish; continuing with what the image already has"
          fi
          if ! timeout 200 sudo apt-get $APT_OPTS install -y --no-install-recommends \
                 mesa-vulkan-drivers vulkan-validationlayers xvfb; then
            echo "::warning::apt-get install did not finish; the steps below assert what actually landed"
          fi
          for package in mesa-vulkan-drivers vulkan-validationlayers xvfb; do
            dpkg -s "$package" >/dev/null 2>&1 || echo "::warning::$package is not installed"
          done
          command -v xvfb-run >/dev/null 2>&1 || echo "::warning::xvfb-run is missing"
          ls /usr/share/vulkan/icd.d/lvp_icd*.json >/dev/null 2>&1 \
            || echo "::warning::no lavapipe ICD found; the smoke step will not be able to create a device"

      # `check` rather than `test`: the Vulkan-facing tests live in the minecraft-test source set,
      # which is wired to `check` only. Running just `test` silently executes one pure-logic test
      # class and skips everything that covers the backend.
      - name: Build and test
        run: |
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          xvfb-run -a -s "-screen 0 1280x720x24" \
            gradle --no-daemon clean check jar installDist

      # The context test skips itself when DISPLAY is unset (Assumptions.assumeTrue), and a skipped
      # These tests depend on a software driver and a validation layer whose versions differ between
      # the runner image and any developer machine, and the raw Gradle log is not readable without
      # repository admin. So a failure is surfaced as an annotation, which anyone who can see the run
      # can read, and which names the failing case and what the layer said rather than leaving it to
      # be guessed at from an exit code.
      - name: Surface test failures as annotations
        if: failure()
        run: |
          found=0
          for report in build/test-results/*/TEST-*.xml; do
            [ -f "$report" ] || continue
            grep -qE 'failures="[1-9]|errors="[1-9]' "$report" || continue
            found=1
            detail=$(tr '\n' ' ' < "$report" | sed -n 's/.*\(<failure.*<\/failure>\).*/\1/p' | cut -c1-1200)
            [ -n "$detail" ] || detail="$(tr '\n' ' ' < "$report" | grep -o '<failure[^>]*>' | head -1)"
            [ -n "$detail" ] || detail="the report records a failure but carries no failure element"
            echo "::error title=$(basename "$report")::$detail"
            stderr=$(tr '\n' ' ' < "$report" | sed -n 's/.*<system-err>\(.*\)<\/system-err>.*/\1/p' | cut -c1-1200)
            [ -n "$stderr" ] && echo "::error title=stderr of $(basename "$report")::$stderr"
          done
          [ "$found" = 1 ] || echo "::error title=build failed before the tests ran::no test report recorded a failure"
          # A JVM crash inside the validation layer leaves no failing test behind, so it is reported
          # from the JVM's own error log instead — its Java frames name the test that was running when
          # the layer died, which no exit code can tell us.
          for hs in hs_err_pid*.log; do
            [ -f "$hs" ] || continue
            for range in 1,90 91,180 181,270; do
              from=${range%,*}; to=${range#*,}
              echo "::error title=$hs lines $from-$to::$(sed -n "${from},${to}p" "$hs" | tr '\n' '|' | cut -c1-4000)"
            done
          done
          echo "::notice title=test reports present::$(ls build/test-results/*/ 2>/dev/null | tr '\n' ' ' | cut -c1-600)"
          echo "::notice title=descriptor path cases::$(grep -o '<testcase name="[^"]*"\|/>\|<skipped\|</testcase>' build/test-results/*/TEST-*LavaFlowDescriptorPathTest.xml 2>/dev/null | tr '\n' ' ' | cut -c1-900)"

      # test leaves the build green all the same. Without this step a reordered workflow would
      # silently drop the only runtime coverage of the Minecraft-side context, which is exactly the
      # failure this test exists to catch.
      # A mixin whose target drifted compiles fine and fails when the game starts, so it is checked against the
      # jar the build just resolved rather than left to the first run. Names and the static/instance form are
      # checked; mixins aimed at other mods are skipped by name.
      - name: Check that every Minecraft mixin target still resolves
        run: |
          jar="$(ls ~/.gradle/caches/fabric-loom/minecraftMaven/net/minecraft/minecraft-merged-deobf/*/minecraft-merged-deobf-*.jar | head -1)"
          test -n "$jar" || { echo "::error::the Minecraft jar is not in the loom cache"; exit 1; }
          python3 tools/check_mixin_targets.py "$jar"

      - name: Assert the context test ran rather than skipped
        run: |
          report=build/test-results/minecraftTest/TEST-dev.lavaflow.minecraft.vulkan.LavaFlowVulkanContextTest.xml
          test -f "$report" || { echo "::error::$report is missing"; exit 1; }
          grep -q 'tests="1"' "$report"
          grep -q 'skipped="0"' "$report"
          grep -q 'failures="0"' "$report"
          echo "context test ran: $(grep -oE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "$report")"

      # And the same for the descriptor path. That class skips itself without a display, and its
      # canary skips itself without the validation layer — so either skip would leave the descriptor
      # writes covered nowhere, which is exactly the situation this test was added to end. The four
      # methods are named rather than counted so the step says which coverage is missing when it
      # fails, and the canary is one of them because without it the other three assert nothing.
      - name: Assert the descriptor path test ran rather than skipped
        run: |
          report=build/test-results/minecraftTest/TEST-dev.lavaflow.minecraft.vulkan.LavaFlowDescriptorPathTest.xml
          test -f "$report" || { echo "::error::$report is missing"; exit 1; }
          for method in descriptorSetsAreWrittenOnARealDeviceAndRetireWithTheirBuffer \
                        bufferViewsAreCreatedOnARealDeviceAndRetireWithTheirBuffer \
                        sampledImageDescriptorsRetireWithTheirViewAndTheirSampler \
                        theValidationLayerReportsAForbiddenWrite; do
            grep -q "testcase name=\"$method" "$report" \
              || { echo "::error::$method did not run"; exit 1; }
          done
          grep -q 'skipped="0"' "$report" \
            || { echo "::error::the descriptor path test skipped something"; exit 1; }
          grep -q 'failures="0"' "$report" \
            || { echo "::error::the descriptor path test failed"; exit 1; }
          echo "descriptor path test ran: $(grep -oE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "$report")"

      # Same again for the two classes that cover what the elision work changed: the partial-clear
      # path and the draw path. Both skip themselves without a display, and each is the only coverage
      # its fix has, so a silent skip would leave that fix covered nowhere — the same failure the two
      # steps above exist to prevent, arrived at from a different direction. Methods are named rather
      # than counted so the step says which coverage is missing when it fails.
      - name: Assert the partial-clear churn test ran rather than skipped
        run: |
          report=build/test-results/minecraftTest/TEST-dev.lavaflow.minecraft.vulkan.LavaFlowPartialClearChurnTest.xml
          test -f "$report" || { echo "::error::$report is missing"; exit 1; }
          for method in repeatedPartialClearsRetireNoViews \
                        cachedClearViewsAreReleasedWithTheirTexture; do
            grep -q "testcase name=\"$method" "$report" \
              || { echo "::error::$method did not run"; exit 1; }
          done
          grep -q 'skipped="0"' "$report" \
            || { echo "::error::the partial-clear churn test skipped something"; exit 1; }
          grep -q 'failures="0"' "$report" \
            || { echo "::error::the partial-clear churn test failed"; exit 1; }
          echo "partial-clear churn test ran: $(grep -oE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "$report")"

      - name: Assert the rebind elision test ran rather than skipped
        run: |
          report=build/test-results/minecraftTest/TEST-dev.lavaflow.minecraft.vulkan.LavaFlowRebindElisionTest.xml
          test -f "$report" || { echo "::error::$report is missing"; exit 1; }
          grep -q 'testcase name="repeatBindsAndRepeatUniformValuesAreElided' "$report" \
            || { echo "::error::repeatBindsAndRepeatUniformValuesAreElided did not run"; exit 1; }
          grep -q 'skipped="0"' "$report" \
            || { echo "::error::the rebind elision test skipped something"; exit 1; }
          grep -q 'failures="0"' "$report" \
            || { echo "::error::the rebind elision test failed"; exit 1; }
          echo "rebind elision test ran: $(grep -oE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "$report")"

      # Both of these drive a real render pass, so they skip without a display server — and a skip is
      # green. Each step names the method it expects, rather than counting tests, so a rename shows up
      # here instead of quietly reducing coverage.
      - name: Assert the pass split test ran rather than skipped
        run: |
          report=build/test-results/minecraftTest/TEST-dev.lavaflow.minecraft.vulkan.LavaFlowPassSplitTest.xml
          test -f "$report" || { echo "::error::$report is missing"; exit 1; }
          grep -q 'testcase name="onlyAFirstDrawThatCannotAvoidItSplitsThePass' "$report" \
            || { echo "::error::onlyAFirstDrawThatCannotAvoidItSplitsThePass did not run"; exit 1; }
          grep -q 'skipped="0"' "$report" \
            || { echo "::error::the pass split test skipped something"; exit 1; }
          grep -q 'failures="0"' "$report" \
            || { echo "::error::the pass split test failed"; exit 1; }
          echo "pass split test ran: $(grep -oE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "$report")"

      - name: Assert the GPU timing test ran rather than skipped
        run: |
          report=build/test-results/minecraftTest/TEST-dev.lavaflow.minecraft.vulkan.LavaFlowGpuTimingTest.xml
          test -f "$report" || { echo "::error::$report is missing"; exit 1; }
          grep -q 'testcase name="aFinishedFrameIsTimedOnTheGpu' "$report" \
            || { echo "::error::aFinishedFrameIsTimedOnTheGpu did not run"; exit 1; }
          grep -q 'skipped="0"' "$report" \
            || { echo "::error::the GPU timing test skipped something"; exit 1; }
          grep -q 'failures="0"' "$report" \
            || { echo "::error::the GPU timing test failed"; exit 1; }
          echo "GPU timing test ran: $(grep -oE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "$report")"

      - name: Assert the capability probe test ran
        run: |
          report=build/test-results/minecraftTest/TEST-dev.lavaflow.minecraft.vulkan.LavaFlowCapabilityProbeTest.xml
          test -f "$report" || { echo "::error::$report is missing"; exit 1; }
          grep -q 'testcase name="theProbeNamesTheFlagsThatGateMinecraftsGpuDrawPaths' "$report" \
            || { echo "::error::the capability probe test did not run"; exit 1; }
          grep -q 'failures="0"' "$report" \
            || { echo "::error::the capability probe test failed"; exit 1; }
          echo "capability probe test ran: $(grep -oE 'tests="[0-9]+" skipped="[0-9]+" failures="[0-9]+" errors="[0-9]+"' "$report")"

      # The renderer prints nothing on a successful run, so "exited 0" alone would also be true of a
      # build where the renderer never started. The run is therefore validated, and the step asserts
      # that the layer answered: a switch that silently does nothing must not pass.
      - name: Smoke-test the renderer under the validation layer
        run: |
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          xvfb-run -a -s "-screen 0 1280x720x24" \
            env JAVA_OPTS=-Dlavaflow.validation=true \
            build/install/lavaflow/bin/lavaflow --frames=600 > build/smoke.log 2>&1
          cat build/smoke.log
          grep -q "validation enabled through the VK_LAYER_KHRONOS_validation layer" build/smoke.log
          if grep -q "\[LavaFlow Vulkan validation\]" build/smoke.log; then
            echo "::error::the validation layer reported findings during the smoke run"
            exit 1
          fi

      # 0.1.8 起采样纹理默认走 SHADER_READ_ONLY_OPTIMAL，所以这里反过来跑一遍"退回 GENERAL"那条路：
      # 两条布局在 CI 里都过一遍验证层（布局转换、描述符里的 imageLayout、barrier 作用域），
      # 免得退回开关变成没人走过的小路。
      - name: Smoke-test the GENERAL sampled layout (the opt-out) under the validation layer
        run: |
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          xvfb-run -a -s "-screen 0 1280x720x24" \
            env JAVA_OPTS="-Dlavaflow.validation=true -Dlavaflow.sampledReadOnlyLayout=false" \
            build/install/lavaflow/bin/lavaflow --frames=600 > build/smoke-readonly.log 2>&1
          cat build/smoke-readonly.log
          grep -q "validation enabled through the VK_LAYER_KHRONOS_validation layer" build/smoke-readonly.log
          if grep -q "\[LavaFlow Vulkan validation\]" build/smoke-readonly.log; then
            echo "::error::the validation layer reported findings with the sampled-read-only layout"
            exit 1
          fi

      - name: Upload Fabric mod
        uses: actions/upload-artifact@v6
        with:
          name: lavaflow-fabric
          path: build/libs/lavaflow-*.jar
          if-no-files-found: error
          retention-days: 14
